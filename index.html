<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromium Browser</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #202124; color: #3c4043; overflow: hidden; height: 100vh;
  }
  #titlebar {
    height: 32px; background: #202124; display: flex; align-items: center;
    justify-content: space-between; padding: 0 10px; user-select: none;
    -webkit-app-region: drag;
  }
  #titlebar .app-icon { width: 16px; height: 16px; margin-right: 6px; }
  #titlebar h1 { color: #e8eaed; font-size: 12px; font-weight: 500; letter-spacing: 0.4px; }
  #window-controls { display: flex; gap: 6px; -webkit-app-region: no-drag; }
  #window-controls button {
    width: 32px; height: 32px; border: none; background: transparent;
    color: #e8eaed; cursor: pointer; font-size: 12px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  #window-controls button:hover { background: #3c4043; }
  #window-controls #close-btn:hover { background: #d93025; }

  #tabstrip {
    height: 44px; background: #292a2d; display: flex; align-items: center;
    padding: 0 8px; overflow-x: auto; border-bottom: 1px solid #3c4043;
    user-select: none;
  }
  .tab {
    height: 34px; min-width: 150px; max-width: 260px; background: #292a2d;
    border: 1px solid #3c4043; border-bottom: none; border-radius: 6px 6px 0 0;
    margin-right: 6px; color: #e8eaed; display: flex; align-items: center;
    gap: 6px; padding: 0 10px; cursor: pointer; position: relative;
    font-size: 13px; overflow: hidden;
  }
  .tab:hover { background: #3c4043; }
  .tab.active { background: #202124; border-color: #5f6368; font-weight: 500; }
  .tab .favicon { width: 16px; height: 16px; border-radius: 2px; }
  .tab .close {
    width: 16px; height: 16px; background: transparent; border: none;
    color: #9aa0a6; cursor: pointer; font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .tab .close:hover { color: #e8eaed; background: #3c4043; border-radius: 2px; }
  .tab-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  #new-tab-btn {
    width: 34px; height: 34px; border: 1px solid #3c4043; background: #292a2d;
    color: #e8eaed; border-radius: 6px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-size: 16px; margin-left: 4px;
  }
  #new-tab-btn:hover { background: #3c4043; }

  #navbar {
    height: 44px; background: #202124; display: flex; align-items: center;
    padding: 0 12px; gap: 8px; border-bottom: 1px solid #3c4043;
  }
  .nav-btn {
    width: 34px; height: 34px; border: 1px solid #3c4043; background: #292a2d;
    color: #e8eaed; border-radius: 4px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-size: 14px;
  }
  .nav-btn:hover { background: #3c4043; }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  #urlbar {
    flex: 1; height: 34px; background: #292a2d; border: 1px solid #3c4043;
    border-radius: 4px; color: #e8eaed; padding: 0 10px; font-size: 14px;
    outline: none;
  }
  #urlbar:focus { border-color: #1a73e8; }
  #urlbar::placeholder { color: #9aa0a6; }
  .go-btn {
    width: 34px; height: 34px; border: 1px solid #3c4043; background: #1a73e8;
    color: #fff; border-radius: 4px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-size: 14px;
  }
  .go-btn:hover { background: #1557b0; }

  #bookmarks-bar {
    height: 30px; background: #292a2d; border-bottom: 1px solid #3c4043;
    display: flex; align-items: center; padding: 0 10px; gap: 4px;
    overflow-x: auto; font-size: 12px;
  }
  .bookmark {
    height: 24px; background: #202124; border: 1px solid #3c4043;
    border-radius: 4px; padding: 0 8px; display: flex; align-items: center;
    gap: 4px; color: #e8eaed; cursor: pointer; white-space: nowrap;
  }
  .bookmark:hover { background: #3c4043; }
  #webview-container { flex: 1; overflow: hidden; position: relative; background: #000; }
  webview { width: 100%; height: 100%; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  #content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #loading {
    position: absolute; inset: 0; background: #202124; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; z-index: 10; color: #e8eaed; font-size: 14px;
  }
  .spinner {
    width: 32px; height: 32px; border: 3px solid #3c4043;
    border-top-color: #1a73e8; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar">
    <div style="display:flex;align-items:center;gap:8px;">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231a73e8'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/%3E%3C/svg%3E" class="app-icon" alt="">
      <h1 id="app-title">Chromium Browser</h1>
    </div>
    <div id="window-controls">
      <button id="min-btn">−</button>
      <button id="max-btn">□</button>
      <button id="close-btn">×</button>
    </div>
  </div>

  <div id="content">
    <div id="tabstrip">
      <div class="tab active" id="tab-0">
        <img class="favicon" src="" alt="">
        <span class="tab-title">New Tab</span>
        <button class="close" onclick="closeTab(event, 0)">×</button>
      </div>
      <button id="new-tab-btn" onclick="newTab()">+</button>
    </div>

    <div id="navbar">
      <button class="nav-btn" id="back-btn" onclick="goBack()" disabled>←</button>
      <button class="nav-btn" id="forward-btn" onclick="goForward()" disabled>→</button>
      <button class="nav-btn" id="reload-btn" onclick="reload()">↻</button>
      <input type="text" id="urlbar" placeholder="Search or type URL" spellcheck="false">
      <button class="go-btn" id="go-btn" onclick="loadUrl()">Go</button>
    </div>

    <div id="bookmarks-bar">
      <div class="bookmark" onclick="navigateTo('https://www.google.com')">🔍 Google</div>
      <div class="bookmark" onclick="navigateTo('https://www.youtube.com')">▶ YouTube</div>
      <div class="bookmark" onclick="navigateTo('https://github.com')">⌨ GitHub</div>
      <div class="bookmark" onclick="navigateTo('https://www.wikipedia.org')">📖 Wikipedia</div>
    </div>

    <div id="webview-container">
      <div id="loading" class="hidden">
        <div class="spinner"></div>
        <div>Loading...</div>
      </div>
      <webview id="main-webview" src="about:blank"></webview>
    </div>
  </div>
</div>

<script>
  const webview = document.getElementById('main-webview');
  const urlbar = document.getElementById('urlbar');
  const backBtn = document.getElementById('back-btn');
  const forwardBtn = document.getElementById('forward-btn');
  const reloadBtn = document.getElementById('reload-btn');
  const loading = document.getElementById('loading');
  const goBtn = document.getElementById('go-btn');
  const appTitle = document.getElementById('app-title');

  function loadUrl() {
    let url = urlbar.value.trim();
    if (!url) return;
    if (!url.includes('://')) url = 'https://' + url;
    window.browserAPI.navigate(url);
  }

  function navigateTo(url) {
    urlbar.value = url;
    window.browserAPI.navigate(url);
  }

  function goBack() { window.browserAPI.goBack(); }
  function goForward() { window.browserAPI.goForward(); }
  function reload() { window.browserAPI.reload(); }

  urlbar.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadUrl(); });

  let tabCount = 1;
  function newTab() {
    tabCount++;
    const tab = document.createElement('div');
    tab.className = 'tab active';
    tab.id = 'tab-' + tabCount;
    tab.innerHTML = '<img class="favicon" src="" alt=""><span class="tab-title">New Tab</span><button class="close" onclick="closeTab(event, ' + tabCount + ')">×</button>';
    document.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); });
    const strip = document.getElementById('tabstrip');
    strip.insertBefore(tab, document.getElementById('new-tab-btn'));
    tab.classList.add('active');
  }

  window.closeTab = function closeTab(e, id) {
    e.stopPropagation();
    const el = document.getElementById('tab-' + id);
    if (el) el.remove();
  };

  document.getElementById('min-btn').onclick = () => { /* minimize handled by OS */ };
  document.getElementById('max-btn').onclick = () => {};
  document.getElementById('close-btn').onclick = () => window.close();

  webview.addEventListener('did-start-loading', () => {
    loading.classList.remove('hidden'); goBtn.disabled = true;
  });
  webview.addEventListener('did-stop-loading', () => {
    loading.classList.add('hidden'); goBtn.disabled = false;
    updateUrl(); updateTitle(); updateNavButtons();
  });
  webview.addEventListener('did-fail-load', () => {
    loading.classList.add('hidden'); goBtn.disabled = false;
  });
  webview.addEventListener('dom-ready', () => {
    updateUrl(); updateTitle(); updateNavButtons();
  });
  webview.addEventListener('page-title-updated', (e) => { updateTitle(e.title); });

  function updateUrl() { try { urlbar.value = webview.getURL() || ''; } catch {} }
  function updateTitle(t) {
    appTitle.textContent = t || 'Chromium Browser';
    const activeTab = document.querySelector('.tab.active .tab-title');
    if (activeTab) activeTab.textContent = t || 'New Tab';
  }
  function updateNavButtons() {
    backBtn.disabled = !webview.canGoBack();
    forwardBtn.disabled = !webview.canGoForward();
  }
  window.addEventListener('DOMContentLoaded', () => { updateNavButtons(); });
</script>
</body>
</html>
